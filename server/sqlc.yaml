version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema:
      - "migrations/000001_create_users.up.sql"
      - "migrations/000002_create_sessions.up.sql"
      - "migrations/000003_create_game_table.up.sql"
      - "migrations/000004_create_game_moves_table.up.sql"
      - "migrations/000005_add_displayname_to_users.up.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
